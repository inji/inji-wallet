## Environment-specific overrides for the inji-wallet-uitestrig helm chart.
## Chart defaults (scripts configmap, volumes, init container, RBAC, etc.) live in
## ../../helm/inji-wallet-uitestrig/values.yaml; only override what differs per environment here.

commonLabels:
  app.kubernetes.io/component: inji

## ConfigMaps loaded as env by every module
extraEnvVarsCM:
  - global
  - s3
  - keycloak-host
  - db
  - uitestrig

## Secrets loaded as env by every module
extraEnvVarsSecret:
  - s3
  - keycloak-client-secrets
  - postgres-postgresql

## Enable/disable modules and pick the test image. Lists are replaced, not merged, so keep both entries.
modules:
  - name: android
    enabled: true
    image:
      registry: docker.io
      repository: injistack/uitest-inji-wallet
      tag: develop
    extraEnvVarsCM:
      - android
  - name: ios
    enabled: true
    image:
      registry: docker.io
      repository: injistack/uitest-inji-wallet
      tag: develop
    extraEnvVarsCM:
      - ios

crontime: "0 3 * * *"  ## run cronjob every day at 3 AM (time hr: 0-23); install.sh overrides this

uitestrig:
  configmaps:
    s3:
      s3-host: 'http://minio.minio:9000'
      s3-user-key: 'admin'
      s3-region: ''
    db:
      db-port: '5432'
      db-su-user: 'postgres'
      db-server: 'api-internal.sandbox.xyz.net'
    uitestrig:
      apiInternalEndPoint: 'https://api-internal.sandbox.xyz.net'
      apiEnvUser: 'api-internal.sandbox.xyz.net'
      CHROME_DRIVER_CPU_LIMIT: "2"
      CHROME_DRIVER_MEMORY: 3g
      loginlang: sin
      push-reports-to-s3: 'yes'
      s3-account: Injiuitestrig
      browserstack_username: <provide browserstack_username>
      browserstack_accesskey: <provide browserstack_accesskey>
      eSignet_resource_bundle_url: https://github.com/mosip/esignet/blob/v1.6.1/oidc-ui/public/locales/en.json
      mosip_components_base_urls: auditmanager=api-internal.sandbox.xyz.net;idrepository=api-internal.sandbox.xyz.net;partnermanager=api-internal.sandbox.xyz.net;idauthentication=api-internal.sandbox.xyz.net;policymanager=api-internal.sandbox.xyz.net;authmanager=api-internal.sandbox.xyz.net;resident=api-internal.sandbox.xyz.net;preregistration=api-internal.sandbox.xyz.net;masterdata=api-internal.sandbox.xyz.net;idgenerator=api-internal.sandbox.xyz.net;
      ENV_ENDPOINT: https://api-internal.sandbox.xyz.net
      ENV_TESTLEVEL: smokeAndRegression
      ENV_USER: api-internal.sandbox
      actuatorMimotoEndpoint: /v1/mimoto/actuator/env
      eSignetbaseurl: https://esignet.sandbox.xyz.net
    android:
      browserstack_appId: <provide browserstack_appId>
      browserstack_platformName: Android
      browserstack_deviceName: <provide browserstack_deviceName>  # eg: Google Pixel 7 Pro
      browserstack_platformVersion: <provide browserstack_platformVersion>  # eg: 13.0
      browserstack_buildName: <provide browserstack_buildName>  # eg: dev-int-inji Android Build
      ENV_TESTNG_XML_FILE: androidRegression.xml
      ENV_BROWSERSTACK_CONFIG: androidConfig.yml
    ios:
      browserstack_appId: <provide browserstack_appId>
      browserstack_platformName: ios
      browserstack_deviceName: <provide browserstack_deviceName>  # eg: iPhone 13 Pro
      browserstack_platformVersion: <provide browserstack_platformVersion>  # eg: 15
      browserstack_buildName: <provide browserstack_buildName>  # eg: dev-int-inji Ios Build
      ENV_TESTNG_XML_FILE: iosRegression.xml
      ENV_BROWSERSTACK_CONFIG: iosConfig.yml
